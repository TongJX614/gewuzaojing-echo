# 角色卡模板
# 用于标准化定义故事角色
# 使用方法：复制此模板，填入具体角色信息

characters:
  - name: "角色姓名"
    role: "身份/职业"
    gender: "male/female"           # 可选：性别（用于 TTS 音色推断，未配置 voiceSample/voiceId 时按此选择默认男女声）
    age: ""                         # 可选：年龄（用于 TTS 按年龄选择声线：少年/青年/中年/老年）
    voiceSample: ""                 # 可选：音色克隆参考音频文件名（放在 voice_samples/ 目录下，如 "character1.mp3"）
                                     #   配置后使用 mimo-v2.5-tts-voiceclone 模型克隆该音色
    voiceId: ""                      # 可选：显式指定预置 TTS 音色名（如 冰糖/苏打/Mia/Dean 等，优先级低于 voiceSample）
    personality: "性格描述（2-4句话）"
    speakingStyle: "说话风格描述（如'简短有力'、'学术腔'）"
    background: "背景故事摘要（2-3句话）"
    motivation: "角色动机（推动行为的内在原因）"
    secrets: "角色秘密（隐藏的真相或未公开的过去）"
    relationships: "与其他角色的关系描述"
    appearance: "外貌描述（体态、穿着、特征等）"
    arc: "成长弧线（角色在故事中的心理/情感变化）"

# ============================================================
# 性格标签参考库（可复用）
# ============================================================
# 冷静理性型：逻辑优先，用数据说话，句式精准，不情绪化
# 果断务实型：决策快，短句，命令式，重结果轻过程
# 热血冲动型：行动先于思考，语气激烈，重感情
# 温柔体贴型：关注他人，说话委婉，善于调和
# 阴险狡诈型：话中有话，善于操纵，表面礼貌
# 幽默风趣型：善于缓解气氛，常用比喻和玩笑
# 沉默寡言型：话少但精准，行动代替言语
# 学究型：喜欢长篇大论，引经据典，容易跑题
# ============================================================
