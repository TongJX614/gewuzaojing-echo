# 主线剧情
# 定义故事的主要脉络

main_plot:
  # ============================================================
  # 剧情概要
  # ============================================================
  summary: |
    2087年，记忆修复工程师苏然接到神秘委托，修复一段来自废弃太空站"织女号"的
    损坏记忆数据。在修复过程中，她震惊地发现这段记忆竟然属于她自己——一段被
    强制删除的过去。更令人不安的是，记忆中记录着一场被掩盖的灾难：织女号上的
    非法记忆实验导致12人死亡，而幕后黑手正是雇佣她的公司——织星科技的CEO杜维明。
    苏然必须在真相与安全之间做出抉择：是冒着生命危险揭露真相，还是删除记忆
    继续安稳度活？

  themes:
    - "自我认知 — 当记忆可以被篡改，'我'还是'我'吗？"
    - "真相的代价 — 有些真相，知道了就无法回头"
    - "存在的定义 — AI能否拥有真正的意志？"

  core_conflict: |
    苏然的核心冲突是：真相 vs 安全。
    揭露真相意味着：可能失去工作、被追杀、甚至被再次删除记忆；
    保持沉默意味着：永远不知道自己是谁，活在被编辑过的虚假人生中。
    这个冲突在场景3（对峙）达到顶点。

  # ============================================================
  # 剧情阶段
  # ============================================================
  stages:
    # 第一阶段：开端
    - stage_id: "stage_01"
      name: "开端"
      description: "神秘委托引发的连锁反应"
      scenes:
        - "scene_01"
      key_events:
        - "苏然收到匿名委托邮件"
        - "决定接受委托并开始修复"
        - "在记忆碎片中发现异常"
      emotional_arc: "好奇 → 不安 → 震惊"

    # 第二阶段：发现
    - stage_id: "stage_02"
      name: "发现"
      description: "记忆修复揭示的真相"
      scenes:
        - "scene_02"
      key_events:
        - "苏然进入记忆空间"
        - "发现记忆属于自己"
        - "目睹织女号灾难的真相"
        - "发现杜维明是幕后黑手"
      emotional_arc: "困惑 → 恐惧 → 愤怒"

    # 第三阶段：对峙
    - stage_id: "stage_03"
      name: "对峙"
      description: "真相与谎言的正面交锋"
      scenes:
        - "scene_03"
      key_events:
        - "苏然前往织星科技总部"
        - "与杜维明正面对质"
        - "林晓面临自身存在的拷问"
        - "做出最终选择"
      emotional_arc: "坚定 → 动摇 → 抉择"

    # 第四阶段：结局
    - stage_id: "stage_04"
      name: "结局"
      description: "选择的代价与回响"
      scenes:
        - "scene_04"
      key_events:
        - "根据选择进入不同结局"
        - "每个结局的代价与收获"
        - "故事主题的最终呈现"
      emotional_arc: "释然/遗憾/希望（取决于结局）"

  # ============================================================
  # 剧情节拍
  # ============================================================
  beats:
    - beat_id: "beat_01"
      name: "神秘委托"
      description: "一封匿名邮件打破了苏然平静的夜晚"
      scene: "scene_01"
      purpose: "建立悬疑氛围，引发玩家好奇心"

    - beat_id: "beat_02"
      name: "第一次接触"
      description: "苏然开始修复，发现记忆数据的异常之处"
      scene: "scene_01"
      purpose: "暗示记忆的特殊性，为转折做铺垫"

    - beat_id: "beat_03"
      name: "真相时刻"
      description: "苏然发现记忆属于自己，看到自己被删除的过去"
      scene: "scene_02"
      purpose: "故事核心转折，打破主角和玩家的认知"

    - beat_id: "beat_04"
      name: "灾难重现"
      description: "苏然目睹织女号实验失控的全过程"
      scene: "scene_02"
      purpose: "揭露真相，建立情感冲击"

    - beat_id: "beat_05"
      name: "正面对峙"
      description: "苏然与杜维明在会议室的对峙"
      scene: "scene_03"
      purpose: "情感高潮，权力与真相的交锋"

    - beat_id: "beat_06"
      name: "最终选择"
      description: "苏然做出决定，命运走向终点"
      scene: "scene_03"
      purpose: "玩家代入感的最高点"

    - beat_id: "beat_07"
      name: "回响"
      description: "结局呈现，选择的代价显现"
      scene: "scene_04"
      purpose: "主题升华，留下思考空间"

  # ============================================================
  # 剧情钩子
  # ============================================================
  hooks:
    - hook_id: "hook_01"
      type: "悬念钩子"
      description: "神秘的匿名委托，异常丰厚的报酬，不可告人的条件"
      scene: "scene_01"

    - hook_id: "hook_02"
      type: "转折钩子"
      description: "修复的记忆竟然是自己的，这意味着什么？"
      scene: "scene_02"

    - hook_id: "hook_03"
      type: "情感钩子"
      description: "林晓对自身存在的质疑，苏然发现自己也活在谎言中"
      scene: "scene_03"

    - hook_id: "hook_04"
      type: "结局钩子"
      description: "每个选择都有代价，没有完美结局"
      scene: "scene_04"
