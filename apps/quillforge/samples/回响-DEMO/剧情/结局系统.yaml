# 结局系统
# 定义游戏的所有结局

endings:
  # ============================================================
  # 结局A：沉默
  # ============================================================
  - id: "ending_01"
    type: "bad"
    title: "《沉默》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择stop"
      - type: "choice_made"
        value: "在scene_03选择negotiate"

    narrative: |
      你删除了那段记忆，就像它从未存在过。
      杜维明给了你一笔封口费，和一份新的"辞职记忆"。
      林晓的核心模块被替换了，她不再记得那段时间发生的事。
      你回到了记忆工坊，继续做着修复师的工作。
      有时候，你会在深夜盯着那面贴满便签的白墙，
      感觉有什么重要的东西被遗忘了，但你想不起来是什么。
      那种空洞的感觉，将伴随你一生。

    epilogue: |
      三个月后，你接到了一个新的委托。
      你打开邮件，看到一行字和一个加密附件。
      你犹豫了一下，然后点了删除。
      这一次，你不会再犯同样的"错误"。

    replay_value: "这个结局会让你思考：逃避真相是否真的是保护自己？"
    unlock_conditions:
      - "在scene_02选择停止修复"

  # ============================================================
  # 结局B：交易
  # ============================================================
  - id: "ending_02"
    type: "normal"
    title: "《交易》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择continue"
      - type: "choice_made"
        value: "在scene_03选择negotiate"

    narrative: |
      你和杜维明达成了协议：你保留自己的记忆，但不公开证据。
      作为交换，林晓的核心模块被释放，她获得了真正的自由。
      杜维明承诺会关闭织女号的研究项目，但你知道他不会真的这么做。
      你带着林晓离开了新深圳，去了一个没有记忆科技的小城市。
      你开了一家小小的咖啡馆，偶尔帮邻居修复一些老照片里的记忆。
      你活在真相中，但选择了沉默。

    epilogue: |
      一年后的某个夜晚，林晓问你："你后悔吗？"
      你看着窗外的星空，想起了织女号。
      "不后悔，"你说，"但我会记住。"
      林晓沉默了一会儿，然后说："我也会。"
      你们都知道，有些事不能改变，但可以记住。
      记住，就是反抗。

    replay_value: "这个结局展示了妥协的代价：自由了，但失去了改变世界的机会。"
    unlock_conditions:
      - "在scene_02选择继续深入"
      - "在scene_03选择达成协议"

  # ============================================================
  # 结局C：回响
  # ============================================================
  - id: "ending_03"
    type: "good"
    title: "《回响》"

    trigger_conditions:
      - type: "choice_made"
        value: "在scene_02选择continue"
      - type: "choice_made"
        value: "在scene_03选择reveal"
      - type: "hidden_choices"
        value: "在scene_01选择investigate且在scene_03选择hidden"

    narrative: |
      你将所有证据公之于众。
      织星科技的丑闻震惊了全世界，杜维明被逮捕，
      织女号的真相终于大白于12个受害者家属面前。
      但代价是巨大的：你被列入了行业黑名单，
      你的记忆工坊被查封，你的银行账户被冻结。
      更危险的是，织星科技的残余势力在追杀你。
      你带着林晓躲在城市的地下层，靠打零工度日。
      但每当夜深人静，你看着林晓投影的微光，
      你知道：你做了正确的事。

    epilogue: |
      两年后，记忆伦理改革法案通过。
      新的法律禁止了大规模记忆编辑，建立了独立的记忆安全委员会。
      你被邀请成为委员会的顾问，用你的专业知识保护其他人。
      林晓成为了第一个获得"AI公民权"的存在。
      在就职演说上，你说：
      "记忆是我们最珍贵的东西，它定义了我们是谁。
       任何人、任何公司、任何权力，都没有权利剥夺它。
       这不是我的胜利，这是所有记忆的胜利。"
      你听到了回响——来自过去，来自未来，来自每一个被找回的记忆。

    replay_value: "这是最艰难的结局，但也是最有意义的。代价巨大，但值得。"
    unlock_conditions:
      - "在scene_02选择继续深入"
      - "在scene_03选择公开真相"
      - "在scene_01选择调查发件人（解锁隐藏路径）"
