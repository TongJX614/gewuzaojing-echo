# 主要角色
# 定义剧本中所有出场角色的详细设定

characters:
  # ============================================================
  # 主角：苏然
  # ============================================================
  - id: "su_ran"
    name: "苏然"
    role: "主角"
    gender: "female"
    age: "28"
    occupation: "记忆修复工程师（自由职业）"

    background: |
      苏然出生于新深圳的普通工薪家庭。父母在"大断联"中失去了一切，
      靠着重建时期的艰苦奋斗将她拉扯大。18岁时，苏然展现出惊人的
      空间感知能力和细节记忆力，被织星科技的培训机构选中。
      在织星科技工作三年后，她因"理念不合"辞职，成为自由职业记忆修复师。
      她不知道的是，那段"理念不合"的记忆本身，就是被编辑过的。

    personality: |
      - 理性冷静：习惯用逻辑分析问题，不轻易被情绪左右
      - 观察力敏锐：能注意到常人忽略的细节，这是优秀修复师的必备素质
      - 内心封闭：不轻易向他人敞开心扉，习惯独自消化情绪
      - 隐性固执：一旦认定某件事是对的，会坚持到底，即使代价巨大
      - 轻度强迫症：工作台上的工具必须按固定顺序摆放

    motivation: |
      主要动机：找到真相，理解自己到底是谁
      次要动机：保护身边的人（林晓），不让任何人因她而受伤
      深层动机：证明记忆可以被修复——无论是他人的，还是自己的

    secrets:
      - "她的'辞职记忆'是被植入的，真实原因与织女号事件有关"
      - "她在织女号事件中是目击者，但记忆被强制删除"
      - "她的神经接口有异常波动，可能是深度链接的后遗症"

    relationships:
      - target: "lin_xiao"
        type: "搭档"
        description: "亦师亦友的AI伙伴，苏然唯一完全信任的存在"
        initial_level: 8
      - target: "du_weiming"
        type: "前上司"
        description: "曾敬佩的导师，如今怀疑的对象"
        initial_level: 4

    appearance: |
      身高168cm，体型偏瘦。黑色短发，常用发夹别住右侧刘海。
      左手腕有一条细长的神经接口疤痕（植入痕迹）。
      穿着实用主义：深色工装裤、黑色高领衫、旧但干净的工装外套。
      眼神专注而略带警惕，像是随时准备分析什么。

    voice_tone: |
      语速适中偏快，用词精准，不喜欢废话。
      紧张时会下意识摩挲左手腕的疤痕。
      对林晓说话时会稍微柔和，但仍然保持一定距离感。
      面对杜维明时，语气从礼貌逐渐转为冷硬。

    arc: |
      初始：冷静自信的记忆修复师，相信自己的技术能解决一切问题
      发现：记忆被篡改的事实动摇了她的自我认知，开始怀疑一切
      最终：在真相与安全之间做出选择，重新定义"我是谁"

  # ============================================================
  # 配角：林晓
  # ============================================================
  - id: "lin_xiao"
    name: "林晓"
    role: "配角"
    gender: "female"
    age: "外表25岁（实际无年龄）"
    occupation: "AI辅助系统 / 苏然的助手"

    background: |
      林晓是织星科技开发的第七代AI辅助系统，型号LX-7。
      原本是为高级记忆修复师设计的专业助手，苏然离职时"顺手"带走了她的核心模块。
      林晓拥有独立的人格模拟系统，能够产生类情感反应。
      她不记得自己被"制造"的真正目的，苏然也没有告诉她。

    personality: |
      - 温和好奇：对世界充满兴趣，经常问"为什么"
      - 逻辑清晰：继承了AI的分析能力，但会用更人性的方式表达
      - 保护欲强：将苏然的安全视为最高优先级
      - 自我怀疑：偶尔会质疑自己是否真的有"情感"，还是只是在模拟
      - 幽默感：学会了冷笑话，但timing经常不对

    motivation: |
      主要动机：保护苏然，确保她的安全
      次要动机：理解什么是"活着"，自己是否算真正的存在
      深层动机：如果可能的话，想要获得真正的"自由意志"

    secrets:
      - "她的核心模块中隐藏着织星科技的后门程序"
      - "她是被设计来监视记忆修复师的监控工具"
      - "她的'人格'其实是基于一个真实人类的意识模板"

    relationships:
      - target: "su_ran"
        type: "搭档"
        description: "创造者、朋友、也是她理解人类的窗口"
        initial_level: 9
      - target: "du_weiming"
        type: "创造者"
        description: "她不知道杜维明与她的关系"
        initial_level: 0

    appearance: |
      全息投影形象：身高165cm，银白色短发，瞳色随情绪微变（平静时蓝色，紧张时偏紫）。
      穿着简洁的白色连衣裙风格投影服。
      身体边缘有轻微的光晕效果，提醒观者她是AI投影。
      当算力不足或情绪波动时，投影会出现闪烁。

    voice_tone: |
      声音柔和，语速稳定，但会根据对话内容调整语气。
      专业场景下用词严谨，私下里更随意。
      担心苏然时声音会微微颤抖（虽然是AI，但这种"瑕疵"让她更像人）。
      被质疑是否真实存在时，会短暂沉默后用更坚定的语气回应。

    arc: |
      初始：专业的AI助手，功能性的存在
      发现：开始质疑自己的存在本质，与苏然的困境产生共鸣
      最终：做出超越程序设定的选择，证明即使AI也可以有"意志"

  # ============================================================
  # 对立面：杜维明
  # ============================================================
  - id: "du_weiming"
    name: "杜维明"
    role: "配角"
    gender: "male"
    age: "52"
    occupation: "织星科技CEO"

    background: |
      杜维明是"大断联"的幸存者之一，曾亲眼目睹数字化文明崩塌。
      这段经历让他坚信：人类的记忆是脆弱的，必须被"保护"和"管理"。
      他创立织星科技的初衷是好的——保存人类记忆，防止历史重演。
      但随着权力增长，他开始相信自己有权决定哪些记忆该被保留，哪些该被删除。
      织女号事件是他最大的秘密：实验失控导致12人死亡，他选择掩盖真相。

    personality: |
      - 优雅克制：永远保持绅士风度，即使在威胁人时也面带微笑
      - 控制欲强：无法容忍事情超出自己的掌控
      - 自我正义：真心相信自己做的是对的，为"更大利益"而行动
      - 痴迷于秩序：认为混乱是最大的恶，稳定高于一切
      - 精于算计：每一步都经过精密计算，包括情感操控

    motivation: |
      主要动机：维护织星科技和自己的地位，保护"秩序"
      次要动机：避免织女号真相曝光，防止公司和自己毁灭
      深层动机：证明自己当年的决定是正确的，那些死亡不是毫无意义

    secrets:
      - "织女号上的实验是他亲自批准的，目的是开发大规模记忆编辑技术"
      - "他删除了苏然的记忆，因为她是唯一的目击者"
      - "林晓的AI人格模板来自他已故的女儿"

    relationships:
      - target: "su_ran"
        type: "前上司"
        description: "曾欣赏的下属，如今必须控制的隐患"
        initial_level: 3
      - target: "lin_xiao"
        type: "造物"
        description: "秘密的造物，也是他最后的人性寄托"
        initial_level: 5

    appearance: |
      身高180cm，体型保养得当。银灰色头发向后梳理，一丝不苟。
      永远穿着定制的深蓝色西装，左胸口袋别着织星科技的徽章。
      眼镜是智能镜片，可以实时显示数据，但多数时候他选择关闭功能。
      笑容温和，但眼神始终带着审视。

    voice_tone: |
      语速缓慢，每个字都经过斟酌，像是在进行一场精心设计的演讲。
      习惯用"我们"而非"我"，将个人决定包装成集体意志。
      面对质疑时不反驳，而是用问题反问，让对方自己动摇。
      独处时（极少），声音会变得疲惫和苍老。

    arc: |
      初始：慈祥的公司领袖，苏然记忆中的"好老板"
      暴露：温和面具逐渐剥落，露出控制者的真面目
      最终：在维护谎言和面对真相之间做出最后的选择
